<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตัวอย่างเว็บไซต์บนมือถือ — PB Valley</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eee9e2; color: #472d1e; font-family: system-ui, sans-serif; }
    header { padding: 18px 24px; background: #fffaf3; border-bottom: 1px solid #ddcdbb; display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 18px; margin: 0; }
    select, button { font: inherit; border: 1px solid #cfb89e; border-radius: 8px; padding: 8px 12px; background: white; color: #472d1e; }
    button { cursor: pointer; }
    main { padding: 24px; overflow: auto; }
    .phone { width: max-content; margin: auto; padding: 10px; background: #29221c; border-radius: 32px; box-shadow: 0 14px 40px #472d1e26; }
    iframe { display: block; width: 390px; height: 844px; border: 0; border-radius: 23px; background: #fff; }
    .note { text-align: center; font-size: 13px; margin: 0 0 18px; color: #79614d; }
  </style>
</head>
<body>
  <header>
    <h1>ตัวอย่างเว็บไซต์บนมือถือ</h1>
    <label>ขนาดหน้าจอ
      <select id="size">
        <option value="390,844">390 × 844</option>
        <option value="375,812">375 × 812</option>
        <option value="360,800">360 × 800</option>
        <option value="430,932">430 × 932</option>
        <option value="768,1024">แท็บเล็ต 768 × 1024</option>
      </select>
    </label>
    <button id="reload" type="button">รีเฟรชตัวอย่าง</button>
  </header>
  <main>
    <p class="note">เลื่อนและคลิกในกรอบได้เหมือนหน้าเว็บจริง • ตัวอย่างขนาดหน้าจอ การสัมผัสและพฤติกรรมเบราว์เซอร์อาจต่างจากเครื่องจริง</p>
    <div class="phone"><iframe id="preview" src="index.html" title="เว็บไซต์ PB Valley ในขนาดหน้าจอมือถือ"></iframe></div>
  </main>
  <script>
    const preview = document.getElementById('preview');
    document.getElementById('size').addEventListener('change', event => {
      const [width, height] = event.target.value.split(',');
      preview.style.width = width + 'px';
      preview.style.height = height + 'px';
    });
    document.getElementById('reload').addEventListener('click', () => {
      preview.src = 'index.html?preview=' + Date.now();
    });
  </script>
</body>
</html>
